    <style>
    :root {
      --violet: #a855f7;
      --pink: #ec4899;
      --amber: #f59e0b;
      --border: rgba(255, 255, 255, .13);
      --soft: rgba(255, 255, 255, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      color: #f8fafc;
      font-family: Outfit, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(192, 38, 211, .32), transparent 28rem),
        radial-gradient(circle at 12% 18%, rgba(139, 92, 246, .22), transparent 26rem),
        radial-gradient(circle at 88% 34%, rgba(236, 72, 153, .16), transparent 24rem),
        linear-gradient(180deg, #07000f 0%, #10051d 42%, #05010b 100%);
      transition: background 0.3s ease, color 0.3s ease;
    }


    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .7), transparent 80%);
    }


    .glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, .105), rgba(255, 255, 255, .035));
      border: 1px solid var(--border);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, .42),
        inset 0 1px 0 rgba(255, 255, 255, .08);
      backdrop-filter: blur(20px);
    }


    .neon-card {
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03)),
        radial-gradient(circle at top, rgba(168, 85, 247, .18), transparent 55%);
      border: 1px solid rgba(255, 255, 255, .13);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .32);
      transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease;
    }

    .neon-card:hover {
      transform: translateY(-7px);
      border-color: rgba(216, 180, 254, .46);
      box-shadow: 0 24px 75px rgba(126, 34, 206, .28);
    }


    .section-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 6.5rem 1.25rem;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      color: #e9d5ff;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .kicker::before,
    .kicker::after {
      content: "";
      width: 32px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(216, 180, 254, .75));
    }

    .kicker::after {
      background: linear-gradient(90deg, rgba(216, 180, 254, .75), transparent);
    }

    .title-glow {
      text-shadow: 0 0 34px rgba(216, 180, 254, .18);
    }

    .gradient-text {
      background: linear-gradient(90deg, #fff, #e9d5ff 42%, #f9a8d4 72%, #fed7aa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .badge {
      background: rgba(168, 85, 247, .12);
      border: 1px solid rgba(216, 180, 254, .25);
      box-shadow: 0 0 28px rgba(168, 85, 247, .08);
    }


    .skill-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      margin: 0 auto 1rem;
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, .18));
      transition: transform .25s ease, filter .25s ease;
    }

    .skill-tile:hover .skill-logo {
      transform: translateY(-5px) scale(1.08);
      filter: drop-shadow(0 0 18px rgba(236, 72, 153, .28));
    }

    .project-overlay {
      background: linear-gradient(180deg, transparent 0%, rgba(5, 1, 11, .76) 45%, rgba(5, 1, 11, .98) 100%);
    }

    html {
      scroll-behavior: smooth;
    }

    .menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.88);
      transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
    }

    .menu-toggle.open span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.open span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    @media (max-width: 768px) {
      .nav-glass {
        padding: 0.75rem 1rem;
      }

      .nav-glass nav {
        padding: 0.5rem 0;
      }
    }

    @media (max-width: 480px) {
      .nav-glass {
        padding: 0.5rem 0.75rem;
      }

      .nav-glass nav {
        padding: 0.25rem 0;
      }
    }

    .nav-glass {
      background: rgba(7, 1, 13, 0.7);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.3s ease, box-shadow 0.3s ease, padding 0.3s ease, transform 0.3s ease;
    }

    .nav-scrolled {
      background: rgba(7, 1, 13, 0.85);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-hidden {
      transform: translateY(-100%);
    }

    .timeline-container {
      position: relative;
      padding: 2rem 1rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      --timeline-item-gap: 2rem;
      --timeline-center-column: 4rem;
      --timeline-connector-width: calc(var(--timeline-item-gap) + (var(--timeline-center-column) / 2));
    }

    .timeline-floaters {
      pointer-events: none;
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .timeline-floater {
      position: absolute;
      border-radius: 999px;
      filter: blur(30px);
      opacity: 0.22;
      transform: translate3d(0, 0, 0);
    }

    .timeline-floater.one {
      width: 140px;
      height: 140px;
      background: rgba(168, 85, 247, 0.3);
      top: 10%;
      left: 8%;
    }

    .timeline-floater.two {
      width: 100px;
      height: 100px;
      background: rgba(79, 70, 229, 0.25);
      bottom: 14%;
      right: 10%;
    }

    .timeline-floater.three {
      width: 180px;
      height: 180px;
      background: rgba(37, 99, 235, 0.14);
      top: 40%;
      right: 18%;
    }

    /* Responsive Academic Timeline */
    .timeline-line {
      position: absolute;
      left: 50%;
      top: calc(2rem + 122px);
      width: 4px;
      bottom: calc(1.5rem + 122px);
      transform: translateX(-50%);
      border-radius: 9999px;
      background: linear-gradient(to top, rgba(59,130,246,0.4), rgba(168,85,247,0.85), rgba(79,70,229,0.65));
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.45), 0 0 36px rgba(124, 58, 237, 0.25);
      animation: flowLine 8s linear infinite;
      background-size: 100% 200%;
      background-position: bottom;
      z-index: 1;
    }

    @keyframes flowLine {
      to {
        background-position: top;
      }
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--timeline-center-column) minmax(0, 1fr);
      gap: var(--timeline-item-gap);
      align-items: start;
      justify-items: stretch;
    }

    .timeline-card-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
    }

    .timeline-card-wrapper::before,
    .timeline-card-wrapper::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .timeline-card-wrapper::before {
      width: var(--timeline-connector-width);
      height: 2px;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(168,85,247,0.85), rgba(79,70,229,0.55));
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.35);
      z-index: 0;
    }

    .timeline-card-wrapper::after {
      width: 0.62rem;
      height: 0.62rem;
      border-top: 2px solid rgba(168, 85, 247, 0.9);
      border-right: 2px solid rgba(168, 85, 247, 0.9);
      filter: drop-shadow(0 0 7px rgba(168, 85, 247, 0.45));
      z-index: 1;
    }

    .timeline-card-wrapper.left {
      grid-column: 1;
      justify-content: flex-end;
      text-align: right;
    }

    .timeline-card-wrapper.left::before {
      right: calc(var(--timeline-connector-width) * -1);
    }

    .timeline-card-wrapper.left::after {
      right: -0.34rem;
      transform: translateY(-50%) rotate(45deg);
    }

    .timeline-card-wrapper.right {
      grid-column: 3;
      justify-content: flex-start;
      text-align: left;
    }

    .timeline-card-wrapper.right::before {
      left: calc(var(--timeline-connector-width) * -1);
    }

    .timeline-card-wrapper.right::after {
      left: -0.34rem;
      transform: translateY(-50%) rotate(-135deg);
    }

    .timeline-marker-wrapper {
      position: relative;
      grid-column: 2;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 244px;
    }

    .timeline-marker {
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, rgba(168,85,247,1), rgba(79,70,229,1));
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.5), 0 0 34px rgba(124, 58, 237, 0.35);
      animation: markerGlow 2s ease-in-out infinite alternate;
    }

    @keyframes markerGlow {
      from {
        box-shadow: 0 0 18px rgba(168, 85, 247, 0.5), 0 0 34px rgba(124, 58, 237, 0.35);
      }
      to {
        box-shadow: 0 0 26px rgba(168, 85, 247, 0.75), 0 0 46px rgba(124, 58, 237, 0.45);
      }
    }

    .timeline-marker-active {
      opacity: 1;
    }

    @media (min-width: 768px) and (max-width: 1199px) {
      .timeline-list {
        gap: 2.4rem;
      }

      .timeline-container {
        padding: 1.75rem 0.75rem 1.25rem;
        --timeline-item-gap: 1.25rem;
        --timeline-center-column: 3.25rem;
        --timeline-connector-width: calc(var(--timeline-item-gap) + (var(--timeline-center-column) / 2));
      }

      .timeline-line {
        top: calc(1.75rem + 116px);
        bottom: calc(1.25rem + 116px);
      }

      .timeline-item {
        grid-template-columns: minmax(0, 1fr) var(--timeline-center-column) minmax(0, 1fr);
      }

      .timeline-line {
        width: 3px;
      }

      .timeline-marker {
        width: 1rem;
        height: 1rem;
      }
    }

    @media (max-width: 767px) {
      .timeline-container {
        padding: 2.5rem 0.75rem 2rem 0.25rem;
        --timeline-connector-width: 1.35rem;
      }

      .timeline-line {
        display: block;
        left: 2.05rem;
        top: calc(2.5rem + 118px);
        bottom: calc(2rem + 118px);
        width: 3px;
        transform: none;
      }

      .timeline-list {
        gap: 2.75rem;
      }

      .timeline-item {
        grid-template-columns: 4.1rem minmax(0, 1fr);
        gap: 0;
        align-items: start;
        position: relative;
      }

      .timeline-marker-wrapper {
        grid-column: 1;
        grid-row: 1;
        justify-content: center;
        width: 4.1rem;
        min-height: 236px;
      }

      .timeline-marker {
        width: 18px;
        height: 18px;
      }

      .timeline-connector {
        display: none;
      }

      .timeline-card-wrapper::before {
        display: block;
        content: '';
        position: absolute;
        left: -4.1rem;
        top: 1.25rem;
        width: 4.1rem;
        height: 2px;
        background: linear-gradient(to right, rgba(168,85,247,0.8), rgba(79,70,229,0.55));
        box-shadow: 0 0 14px rgba(168, 85, 247, 0.3);
        border-radius: 9999px;
      }

      .timeline-card-wrapper,
      .timeline-card-wrapper.left,
      .timeline-card-wrapper.right {
        grid-column: 2;
        grid-row: 1;
        justify-content: flex-start;
        text-align: left;
        width: 100%;
        min-width: 0;
      }

      .timeline-card-wrapper::before,
      .timeline-card-wrapper::after {
        display: none;
      }

      .timeline-card-wrapper .timeline-card {
        width: 94%;
        max-width: 94%;
        min-height: 236px;
        padding: 1.15rem;
        border-radius: 1.35rem;
      }

      .timeline-card-title {
        font-size: clamp(1rem, 4.6vw, 1.125rem);
        line-height: 1.35;
      }

      .timeline-card-subtitle {
        font-size: 0.875rem;
        line-height: 1.55;
      }

      .timeline-badge {
        font-size: 0.75rem;
        padding: 0.5rem 0.72rem;
      }

      .timeline-card-button {
        font-size: 0.875rem;
        min-height: 44px;
        width: min(100%, 10.5rem);
      }
    }

    /* ============================================
       RESPONSIVE TIMELINE TYPOGRAPHY
       ============================================ */
    /* Desktop (1200px+) */
    @media (min-width: 1200px) {
      #about .title-glow {
        font-size: 2.375rem;
        line-height: 1.15;
      }

      .timeline-card-title {
        font-size: 1.75rem;
        line-height: 1.2;
      }

      .timeline-card-subtitle {
        font-size: 1rem;
      }

      .timeline-badge {
        font-size: 0.875rem;
      }
    }

    /* Tablet (768px-1199px) */
    @media (min-width: 768px) and (max-width: 1199px) {
      #about .title-glow {
        font-size: 2rem;
        line-height: 1.2;
      }

      .timeline-card-title {
        font-size: 1.5rem;
        line-height: 1.25;
      }

      .timeline-card-subtitle {
        font-size: 0.9375rem;
      }

      .timeline-badge {
        font-size: 0.8125rem;
      }
    }

    @media (max-width: 767px) {
      #about .title-glow {
        font-size: clamp(1.125rem, 5.4vw, 1.375rem);
        line-height: 1.25;
      }

      #about .kicker {
        font-size: 0.72rem;
      }
    }

    .timeline-card {
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(9, 10, 25, 0.88);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.24);
      padding: 1.35rem;
      max-width: 520px;
      width: 100%;
      min-height: 244px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
      z-index: 2;
      transform: translateY(0);
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .timeline-card-details {
      will-change: height, opacity, transform;
    }

    @media (hover: hover) and (pointer: fine) {
      .timeline-card:hover {
        transform: translateY(-6px);
        border-color: rgba(168, 85, 247, 0.4);
        box-shadow: 0 0 30px rgba(168, 85, 247, 0.15), 0 0 60px rgba(168, 85, 247, 0.1);
      }
    }

    .timeline-card h4,
    .timeline-card p,
    .timeline-card strong {
      color: #f8fafc;
    }

    .timeline-connector {
      display: none;
    }

    @media (max-width: 767px) {
      .timeline-connector {
        display: block;
      }
    }

    .timeline-badge,
    .timeline-chip,
    .timeline-card-button,
    .timeline-more-toggle {
      font-weight: 600;
    }

    .timeline-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.55rem 0.9rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d8b4fe;
      font-size: 0.82rem;
      flex: 0 1 auto;
      max-width: 100%;
      line-height: 1.25;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .timeline-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      justify-content: flex-start;
    }

    .timeline-meta span {
      min-width: 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .timeline-step-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.55rem 0.85rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #c4b5fd;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .timeline-details p {
      margin: 0;
    }

    .timeline-chip {
      display: inline-flex;
      align-items: center;
      padding: 0.55rem 0.85rem;
      border-radius: 9999px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.22);
      color: #e9d5ff;
      font-size: 0.8rem;
      margin-bottom: 0.35rem;
    }

    .timeline-card-footer {
      width: 100%;
    }

    .timeline-card-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-width: max-content;
      min-height: 46px;
      padding: 0 1.25rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #eef2ff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 10px 24px rgba(112, 60, 255, 0.16);
      transition: background 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    /* Mobile button centering */
    @media (max-width: 767px) {
      .timeline-card-footer {
        justify-content: center;
      }

      .timeline-card-button {
        width: min(100%, 10.5rem);
        min-width: auto;
      }
    }

    .timeline-card-button:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(168, 85, 247, 0.28);
        box-shadow: 0 12px 28px rgba(168, 85, 247, 0.22);
    }

    .timeline-card-button:active {
      transform: translateY(-1px) scale(0.98);
    }

    .timeline-card-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.35);
    }

    .timeline-card-label {
      font-weight: 700;
      font-size: 0.96rem;
      color: #eef2ff;
      line-height: 1;
      margin: 0;
    }

    .timeline-card-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      color: #dfe7ff;
      opacity: 0.95;
      transform-origin: center;
      backface-visibility: hidden;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    }

    .timeline-more-toggle {
      border: none;
      background: transparent;
      color: #c4b5fd;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .timeline-more-toggle span {
      display: inline-block;
      transform: translateY(0);
      transition: transform 0.25s ease;
    }

    .timeline-more-toggle.expanded span {
      transform: rotate(180deg);
    }

    .timeline-subtitle {
      color: #c8c8ff;
      max-width: 780px;
      margin: 0 auto;
      line-height: 1.8;
    }

    .nav-scrolled {
      background: rgba(7, 1, 13, 0.88);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    .focus-ring:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.45);
    }

    .featured-highlight {

      overflow: hidden;
    }

    .featured-highlight::before {
      content: "";
      position: absolute;
      inset: 0;
      margin: -1px;
      border-radius: 2.25rem;
      background: linear-gradient(90deg, rgba(248, 209, 255, 0.35), rgba(99, 102, 241, 0.35), rgba(251, 146, 60, 0.35));

    /* ============================================
       GLOBAL RESPONSIVE FOUNDATION
       ============================================ */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    img, video, svg, picture, canvas {
      max-width: 100%;
      height: auto;
    }

    /* Use clamp() for typography */
    .section-shell h2 {
      font-size: clamp(1.75rem, 4.5vw, 3.75rem);
      line-height: 1.1;
    }

    .section-shell p,
    .section-shell span,
    .section-shell div {
      max-width: 100%;
    }

    /* Universal box fix */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* Sliding nav hide/show */
    .nav-hidden {
      transform: translateY(-110%);
    }

    .nav-glass {
      transition: transform 0.35s ease, background 0.3s ease, box-shadow 0.3s ease, padding 0.3s ease;
    }

    /* Slide-out menu from right */
    .slide-menu-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 49;
    }

    .slide-menu-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100dvh;
      width: min(86vw, 360px);
      background: linear-gradient(160deg, rgba(20, 4, 35, 0.96), rgba(7, 1, 13, 0.96));
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: -25px 0 60px rgba(0, 0, 0, 0.55);
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: clamp(1.25rem, 4vw, 2rem);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .slide-menu-close {
      align-self: flex-end;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      cursor: pointer;
      margin-bottom: 1.25rem;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .slide-menu-close:hover,
    .slide-menu-close:focus-visible {
      background: rgba(168, 85, 247, 0.18);
      outline: none;
    }

    .slide-menu-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .slide-menu-link {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.95rem 1.1rem;
      border-radius: 1.1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #f1f5f9;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .slide-menu-link:hover,
    .slide-menu-link:focus-visible {
      background: rgba(168, 85, 247, 0.15);
      border-color: rgba(168, 85, 247, 0.4);
      transform: translateX(4px);
      outline: none;
    }

    .slide-menu-icon {
      width: 22px;
      height: 22px;
      color: #d8b4fe;

    }

    /* ============================================

    .hero-section {

      text-align: center;

    .hero-title {
      font-size: clamp(1.85rem, 5.5vw, 3.75rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
      max-width: 64ch;
      margin: 1rem auto 0;
    }

    .hero-sub {
      font-size: clamp(0.95rem, 2.2vw, 1.25rem);
      line-height: 1.7;
      max-width: 60ch;
      margin: 1rem auto 0;
    }

    .hero-greeting {
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      margin-top: 1.75rem;

      justify-content: center;

      padding: 0.5rem 1rem;
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
      margin-top: 1.5rem;
    }

    .hero-cta a {
      padding: 0.85rem 1.75rem;
      font-size: clamp(0.9rem, 1.6vw, 1.05rem);

    .profile-ring {

      height: clamp(8rem, 22vw, 11rem);

       SKILLS GRID

      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    /* ============================================

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
    }

    .cert-card {
      padding: 1.5rem 1.1rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* ============================================
       PROJECTS
       ============================================ */
    .featured-card {
      padding: 1.5rem;
      border-radius: 1.5rem;
    }

    .featured-title {
      font-size: clamp(1.6rem, 3.5vw, 3rem);
      line-height: 1.15;
    }

    .featured-grid {
      display: grid;
      gap: 2rem;
      grid-template-columns: 1fr 1fr;
      align-items: center;
    }

    .projects-grid {

      gap: 1rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 1.25rem;

    }

      gap: 0.85rem;

      flex-direction: column;

      min-width: 0;

      font-size: 0.95rem;
      padding: 0.85rem 1.1rem;

    .contact-form-fields > label {

    @media (max-width: 1199px) {

    /* ============================================
       NAV TOGGLE (Hamburger)
       ============================================ */
    .nav-toggle {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .nav-toggle:hover,
    .nav-toggle:focus-visible {
      background: rgba(168, 85, 247, 0.15);
      outline: none;
    }

    .nav-toggle svg {
      width: 22px;
      height: 22px;
    }

    /* ============================================
       REDUCED MOTION
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Prevent body scroll when menu open */
    body.menu-open {
      overflow: hidden;
    }

    /* ============================================
       STANDARDIZED BUTTON STYLES
       ============================================ */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      outline: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn-secondary:active {

    /* ============================================
       STANDARDIZED CARD STYLES
       ============================================ */
    .card-base {
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      padding: 1.25rem;
      transition: all 0.3s ease;
    }

    .card-base:hover {

      border-color: rgba(168, 85, 247, 0.3);
      box-shadow: 0 12px 40px rgba(168, 85, 247, 0.15);
    }

    @media (min-width: 640px) {
      .card-base {
        border-radius: 1.75rem;
        padding: 1.5rem;
      }
    }

    /* ============================================
       IMPROVED TYPOGRAPHY HIERARCHY
       ============================================ */
    .text-h1 {
      font-size: clamp(1.85rem, 5.5vw, 3.75rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
      font-weight: 700;
    }

    .text-h2 {
      font-size: clamp(1.75rem, 4.5vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 600;
    }

    .text-h3 {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      line-height: 1.25;
      letter-spacing: -0.01em;
      font-weight: 600;
    }

    .text-body {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .text-caption {
      font-size: clamp(0.85rem, 1.5vw, 0.95rem);
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    /* Improved readability */
    p, span, div {
      max-width: 100%;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Focus ring for accessibility */
    .focus-ring:focus-visible {
      outline: 2px solid rgba(168, 85, 247, 0.6);
      outline-offset: 2px;
    }

    .focus-ring:focus:not(:focus-visible) {
      outline: none;
    }

    /* ============================================
       IMPROVED ANIMATIONS
       ============================================ */
    .fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    .slide-up {
      animation: slideUp 0.6s ease-out forwards;
    }

    .scale-in {
      animation: scaleIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

      useEffect(() => {
        let lastScrollY = window.scrollY;
        const handleScroll = () => {
          const currentY = window.scrollY;
          setIsScrolled(currentY > 28);

          // Hide on scroll down, show on scroll up
          if (currentY > lastScrollY && currentY > 120) {
            setNavHidden(true);
          } else {
            setNavHidden(false);
          }
          lastScrollY = currentY;

          // Active section detection
          const sections = navItems.map(([_, href]) => href.replace('#', ''));
          let current = 'header';
          for (const id of sections) {
            const el = document.getElementById(id);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top <= 120 && rect.bottom >= 120) {
                current = id;
                break;
              }
            }
          }
          setActiveSection(current);
        };

        const handleKeydown = (event) => {
          if (event.key === 'Escape' && open) {
            setOpen(false);
          }
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        window.addEventListener('keydown', handleKeydown);
        handleScroll();

        return () => {
          window.removeEventListener('scroll', handleScroll);

        try {

                    <img src={icon} alt={`${label} icon`} className="h-10 w-10 rounded-2xl bg-white/5 p-1.5 sm:h-12 sm:w-12 sm:rounded-3xl sm:p-2" loading="lazy" />

                  </div>
                  <b className="mt-3 block text-white text-sm break-all sm:mt-4 sm:text-base">{value}</b>
                </a>
              ))}
            </div>
            <form onSubmit={submitForm} className="glass contact-form-card rounded-[2rem] p-4 text-left sm:p-5 lg:p-6">
              <div className="contact-form-fields grid gap-3 sm:gap-4 sm:grid-cols-2">
                <label className="block min-w-0">
                  <span className="sr-only">Name</span>
                  <input name="name" required placeholder="Your name" aria-label="Your name" className="contact-input w-full rounded-xl border border-white/10 bg-white/[.06] px-3 py-2.5 text-white outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-500/20 sm:rounded-2xl sm:px-4 sm:py-3" />
                </label>
                <label className="block min-w-0">
                  <span className="sr-only">Email</span>
                  <input name="email" required type="email" placeholder="Your email" aria-label="Your email" className="contact-input w-full rounded-xl border border-white/10 bg-white/[.06] px-3 py-2.5 text-white outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-500/20 sm:rounded-2xl sm:px-4 sm:py-3" />
                </label>
              </div>
              <label className="block mt-3 sm:mt-4">
                <span className="sr-only">Message</span>
                <textarea name="message" required rows="5" placeholder="Message" aria-label="Message" className="contact-textarea w-full rounded-xl border border-white/10 bg-white/[.06] px-3 py-2.5 text-white outline-none transition focus:border-violet-300 focus:ring-2 focus:ring-violet-500/20 resize-none sm:rounded-2xl sm:px-4 sm:py-3 sm:rows-6"></textarea>
              </label>
              <button type="submit" className="btn-primary mt-4 w-full bg-white text-[#12051f] hover:bg-violet-100 sm:w-auto">Send Message</button>
              <p className="mt-3 text-xs text-slate-400 sm:text-sm">{status}</p>
            </form>
          </div>
        </Section>
      );
